name: GLYPH LAB Android APK
on:
  push:
    branches: [glyph-lab-v2-android-build]
    paths:
      - 'glyph-lab/**'
      - '.github/workflows/glyph-lab-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: glyph-lab/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and sign debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify signed APK and print checksums
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: GLYPH-LAB-v2.1-debug-signed-APK
          path: glyph-lab/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error