name: TRACE installable signed Android APK
on:
  push:
    paths:
      - 'TRACE/**'
      - '.github/workflows/trace-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install current Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed debug APK
        working-directory: TRACE
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          APK=TRACE/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/TRACE-1.3-signed-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TRACE-1.3-signed-debug-APK
          path: dist/TRACE-1.3-signed-debug.apk
          if-no-files-found: error
