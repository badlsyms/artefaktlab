name: MASTER LAB Android signed debug
on:
  push:
    branches:
      - masterlab-android-v2-1-build
    paths:
      - 'masterlab-android/**'
      - '.github/workflows/masterlab-android.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterlab-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and sign debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MASTER-LAB-2.1.1-ANDROID-SIGNED-DEBUG
          path: masterlab-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
